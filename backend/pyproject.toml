[project]
name = "valet-backend"
version = "0.1.0"
description = "Valet platform backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "simpy>=4.1",
    "ortools>=9.11",
    "pymc>=5.17",
    "lightgbm>=4.5",
    "mapie>=0.9",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "pyotp>=2.10",
    "anthropic>=0.40",
    "httpx>=0.27",
    "python-multipart>=0.0.20",
    "stripe>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "httpx>=0.27",
    "ruff>=0.7",
    "bandit>=1.9",
    "pip-audit>=2.10",
    "schemathesis>=4.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "policies*"]
