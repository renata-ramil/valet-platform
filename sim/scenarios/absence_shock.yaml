# Same demand as weekday_peak, but 20% of valets are randomly absent each
# seed (a called-out sick day or two), to measure the on-time and wait cost
# of being short-staffed at the 8 AM peak.
name: absence_shock
duration_hours: 24
building:
  num_lanes: 14
  max_depth: 8
  num_valets: 6
  background_occupancy_fraction: 0.1
commuters:
  count: 40
  ready_by_hour: 8.0
  ready_by_jitter_minutes_std: 10
  skip_probability: 0.05
on_demand:
  base_rate_per_hour: 0.5
  peak_multiplier: 2.0
  peak_hours: [7, 10]
evening_event:
  enabled: false
valet_absence:
  probability: 0.2
