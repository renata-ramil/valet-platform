services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: valet
      POSTGRES_PASSWORD: valet
      POSTGRES_DB: valet
    ports:
      - "5432:5432"
    volumes:
      - valet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  valet_postgres_data:
