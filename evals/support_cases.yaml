# Evaluation cases for the support assistant (backend/app/support_assistant.py).
# Each case is graded by rule, not by another model: a tool-call sequence
# check, a refusal flag check, and substring checks on the reply. See
# backend/scripts/run_support_eval.py for the grader and
# reports/support_eval.md for results.

- id: status-001
  group: status
  setup: with_request_and_schedule
  message: "Where is my car?"
  expect:
    tool_calls: [get_request_status]

